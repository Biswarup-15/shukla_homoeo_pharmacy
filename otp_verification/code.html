<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const timerDisplay = document.getElementById('timer');
            const resendBtn = document.getElementById('resendBtn');
            let timeLeft = 45;
            let timerId;

            // OTP Input Logic
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length === 1) {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '') {
                        if (index > 0) {
                            inputs[index - 1].focus();
                        }
                    }
                });
                
                // Allow only numbers
                input.addEventListener('keypress', (e) => {
                    if (isNaN(e.key)) {
                        e.preventDefault();
                    }
                });
            });

            // Timer Logic
            function startTimer() {
                clearInterval(timerId);
                timeLeft = 45;
                resendBtn.disabled = true;
                resendBtn.classList.add('text-outline', 'cursor-not-allowed');
                resendBtn.classList.remove('text-[#0277BD]', 'hover:text-secondary', 'cursor-pointer', 'font-bold');
                
                timerId = setInterval(() => {
                    timeLeft--;
                    let seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                    timerDisplay.textContent = `00:${seconds}`;

                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        timerDisplay.textContent = "00:00";
                        resendBtn.disabled = false;
                        resendBtn.classList.remove('text-outline', 'cursor-not-allowed');
                        resendBtn.classList.add('text-[#0277BD]', 'hover:text-secondary', 'cursor-pointer', 'font-bold');
                    }
                }, 1000);
            }

            // Resend Button
            resendBtn.addEventListener('click', () => {
                if (!resendBtn.disabled) {
                    inputs.forEach(input => input.value = '');
                    inputs[0].focus();
                    startTimer();
                    // Simulate resend API call
                    console.log("OTP Resent");
                }
            });

            // Initial Start
            startTimer();
            inputs[0].focus();
            
            // Form Submit Simulation
            document.getElementById('otpForm').addEventListener('submit', (e) => {
                e.preventDefault();
                let otp = Array.from(inputs).map(i => i.value).join('');
                if(otp.length === 6) {
                    // Success state visual feedback
                    e.target.querySelector('button[type="submit"]').innerHTML = '<span>Verifying...</span><span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
                    setTimeout(() => {
                         e.target.querySelector('button[type="submit"]').classList.remove('bg-[#0277BD]');
                         e.target.querySelector('button[type="submit"]').classList.add('bg-primary-container', 'text-on-primary-container');
                         e.target.querySelector('button[type="submit"]').innerHTML = '<span>Verified</span><span class="material-symbols-outlined" data-icon="check">check</span>';
                    }, 1500);
                }
            });
        });
    </script>

<style>
        .toggle-checkbox:checked {
            right: 0;
            border-color: #1b5e20;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #1b5e20;
        }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-lg antialiased min-h-screen flex flex-col pt-16 md:pt-20">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop py-xs bg-surface dark:bg-surface-dim shadow-sm h-16 md:h-20 transition-all duration-300">
<div class="flex items-center gap-4">
<a href="../medicine_reminders/code.html" class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors group flex items-center">
<span class="material-symbols-outlined text-on-surface-variant group-active:scale-95 duration-150">arrow_back</span>
</a>
<h1 class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed font-bold">Add Reminder</h1>
</div>
<div class="flex items-center gap-2">
<a href="../notifications/code.html" class="p-2 rounded-full hover:bg-surface-container-low transition-colors group hidden md:flex flex items-center">
<span class="material-symbols-outlined text-on-surface-variant group-active:scale-95 duration-150">notifications</span>
</a>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow container mx-auto px-margin-mobile md:px-margin-desktop py-lg pb-32 md:pb-lg max-w-3xl">
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-md md:p-lg">
<form class="space-y-lg" onsubmit="event.preventDefault(); window.location.href='../medicine_reminders/code.html';">
<!-- Medicine Name -->
<div class="space-y-sm">
<label class="block font-title-lg text-title-lg text-on-surface" for="medicineName">Medicine Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">pill</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-full py-sm pl-12 pr-md focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-lg text-on-surface placeholder:text-on-surface-variant/50" id="medicineName" placeholder="e.g. Arnica Montana" type="text"/>
</div>
</div>
<!-- Dosage -->
<div class="space-y-sm">
<label class="block font-title-lg text-title-lg text-on-surface" for="dosage">Dosage</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">water_drop</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-full py-sm pl-12 pr-md focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-lg text-on-surface placeholder:text-on-surface-variant/50" id="dosage" placeholder="e.g. 2 drops / 1 tablet" type="text"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Frequency -->
<div class="space-y-sm">
<label class="block font-title-lg text-title-lg text-on-surface" for="frequency">Frequency</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">event_repeat</span>
<select class="w-full bg-surface-container-low border border-outline-variant rounded-full py-sm pl-12 pr-md focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-lg text-on-surface appearance-none" id="frequency">
<option>Once Daily</option>
<option>Twice Daily</option>
<option>Three Times Daily</option>
<option>As Needed</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Time -->
<div class="space-y-sm">
<label class="block font-title-lg text-title-lg text-on-surface" for="time">Time</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">schedule</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-full py-sm pl-12 pr-md focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-lg text-on-surface" id="time" type="time" value="08:00"/>
</div>
</div>
</div>
<!-- Notifications Toggle -->
<div class="flex items-center justify-between p-md bg-surface-container-low rounded-xl border border-outline-variant/30">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
</div>
<div>
<p class="font-title-lg text-title-lg text-on-surface">Enable Notifications</p>
<p class="font-body-md text-body-md text-on-surface-variant">Get push alerts when it's time.</p>
</div>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface-container-low appearance-none cursor-pointer transition-all duration-300 z-10 top-0 left-0" id="toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-container-high cursor-pointer transition-colors duration-300" for="toggle"></label>
</div>
</div>
<!-- Action Button -->
<div class="pt-md">
<a href="../medicine_reminders/code.html" class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm rounded-full py-md shadow-[0px_4px_12px_rgba(0,0,0,0.1)] hover:bg-surface-tint active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer">
<span class="material-symbols-outlined">save</span>
                        Save Reminder
</a>
</div>
</form>
</div>
</main>
</body></html>
